<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leave Request {{#if approved}}Approved{{else}}Rejected{{/if}}</title>
</head>
<body style="margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f3f4f6; padding: 20px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
          <tr>
            <td style="background: linear-gradient(135deg, {{#if approved}}#10b981 0%, #059669 100%{{else}}#ef4444 0%, #dc2626 100%{{/if}}); padding: 30px; text-align: center;">
              <h1 style="margin: 0; color: #ffffff; font-size: 28px; font-weight: 600;">
                {{#if approved}}✓ Leave Approved{{else}}✗ Leave Rejected{{/if}}
              </h1>
            </td>
          </tr>
          <tr>
            <td style="padding: 40px 30px;">
              <p style="margin: 0 0 20px 0; font-size: 16px; color: #374151; line-height: 1.6;">
                Hello <strong>{{userName}}</strong>,
              </p>
              <p style="margin: 0 0 25px 0; font-size: 16px; color: #374151; line-height: 1.6;">
                Your leave request has been <strong style="color: {{#if approved}}#059669{{else}}#dc2626{{/if}};">{{status}}</strong> by <strong>{{approvedBy}}</strong>.
              </p>
              <table width="100%" cellpadding="0" cellspacing="0" style="background-color: {{#if approved}}#f0fdf4{{else}}#fee2e2{{/if}}; border-left: 4px solid {{#if approved}}#10b981{{else}}#ef4444{{/if}}; border-radius: 6px; margin-bottom: 25px;">
                <tr>
                  <td style="padding: 20px;">
                    <table width="100%" cellpadding="0" cellspacing="0">
                      <tr>
                        <td style="padding: 8px 0; font-size: 14px; color: #6b7280; width: 120px;">
                          <strong style="color: #374151;">Leave Type:</strong>
                        </td>
                        <td style="padding: 8px 0; font-size: 14px; color: #1f2937; text-transform: capitalize;">
                          {{leaveType}}
                        </td>
                      </tr>
                      <tr>
                        <td style="padding: 8px 0; font-size: 14px; color: #6b7280;">
                          <strong style="color: #374151;">From:</strong>
                        </td>
                        <td style="padding: 8px 0; font-size: 14px; color: #1f2937;">
                          {{startDate}}
                        </td>
                      </tr>
                      <tr>
                        <td style="padding: 8px 0; font-size: 14px; color: #6b7280;">
                          <strong style="color: #374151;">To:</strong>
                        </td>
                        <td style="padding: 8px 0; font-size: 14px; color: #1f2937;">
                          {{endDate}}
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
              <table width="100%" cellpadding="0" cellspacing="0" style="margin-bottom: 25px;">
                <tr>
                  <td align="center">
                    <a href="{{leaveUrl}}" style="display: inline-block; padding: 14px 32px; background: linear-gradient(135deg, {{#if approved}}#10b981 0%, #059669 100%{{else}}#ef4444 0%, #dc2626 100%{{/if}}); color: #ffffff; text-decoration: none; border-radius: 6px; font-size: 16px; font-weight: 600;">
                      View Leave Details
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="background-color: #f9fafb; padding: 20px 30px; border-top: 1px solid #e5e7eb;">
              <p style="margin: 0; font-size: 12px; color: #9ca3af; text-align: center; line-height: 1.5;">
                This is an automated notification from your CMMS system.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
