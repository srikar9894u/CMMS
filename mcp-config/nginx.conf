events {
    worker_connections 1024;
}

http {
    # Upstream definitions for each MCP server
    upstream mcp_sqlite {
        server mcp-sqlite:8080;
    }

    upstream mcp_postgres {
        server mcp-postgres:8080;
    }

    upstream mcp_filesystem {
        server mcp-filesystem:8080;
    }

    upstream mcp_git {
        server mcp-git:8080;
    }

    upstream mcp_playwright {
        server mcp-playwright:8080;
    }

    upstream mcp_fetch {
        server mcp-fetch:8080;
    }

    upstream mcp_memory {
        server mcp-memory:8080;
    }

    upstream mcp_time {
        server mcp-time:8080;
    }

    upstream mcp_everything {
        server mcp-everything:8080;
    }

    # Main server block
    server {
        listen 80;
        server_name localhost;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "MCP Gateway - All systems operational\n";
            add_header Content-Type text/plain;
        }

        # MCP Servers routing

        location /mcp/sqlite/ {
            proxy_pass http://mcp_sqlite/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /mcp/postgres/ {
            proxy_pass http://mcp_postgres/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /mcp/filesystem/ {
            proxy_pass http://mcp_filesystem/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /mcp/git/ {
            proxy_pass http://mcp_git/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /mcp/playwright/ {
            proxy_pass http://mcp_playwright/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /mcp/fetch/ {
            proxy_pass http://mcp_fetch/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /mcp/memory/ {
            proxy_pass http://mcp_memory/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /mcp/time/ {
            proxy_pass http://mcp_time/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /mcp/everything/ {
            proxy_pass http://mcp_everything/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Root endpoint - Server list
        location / {
            default_type application/json;
            return 200 '{"mcp_gateway": {"version": "1.0.0","servers": [{"name": "sqlite","endpoint": "/mcp/sqlite/","port": 8081,"purpose": "Database inspection and queries"},{"name": "postgres","endpoint": "/mcp/postgres/","port": 8082,"purpose": "PostgreSQL database operations"},{"name": "filesystem","endpoint": "/mcp/filesystem/","port": 8083,"purpose": "File operations and code access"},{"name": "git","endpoint": "/mcp/git/","port": 8084,"purpose": "Git operations and history"},{"name": "playwright","endpoint": "/mcp/playwright/","port": 8085,"purpose": "E2E testing and browser automation"},{"name": "fetch","endpoint": "/mcp/fetch/","port": 8086,"purpose": "Web content fetching and API testing"},{"name": "memory","endpoint": "/mcp/memory/","port": 8087,"purpose": "Persistent context and knowledge graph"},{"name": "time","endpoint": "/mcp/time/","port": 8088,"purpose": "Time and timezone conversions"},{"name": "everything","endpoint": "/mcp/everything/","port": 8089,"purpose": "Reference server with all MCP features"}]}}';
        }
    }
}
