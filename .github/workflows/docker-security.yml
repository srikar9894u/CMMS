name: Docker Security Scan

on:
  push:
    branches: [ main, master, develop, claude/* ]
    paths:
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'opc-service/Dockerfile'
      - 'docker-compose.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'opc-service/Dockerfile'
      - 'docker-compose.yml'
  schedule:
    # Run every Sunday at 2:00 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  scan-backend:
    name: Scan Backend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: cmms-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy scan on Backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cmms-backend:test
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend-results.sarif'
          category: 'docker-backend'

      - name: Run Trivy scan (table output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cmms-backend:test
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'

  scan-frontend:
    name: Scan Frontend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: cmms-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy scan on Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cmms-frontend:test
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-frontend-results.sarif'
          category: 'docker-frontend'

      - name: Run Trivy scan (table output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cmms-frontend:test
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'

  scan-opc-service:
    name: Scan OPC Service Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build OPC Service image
        uses: docker/build-push-action@v5
        with:
          context: ./opc-service
          file: ./opc-service/Dockerfile
          push: false
          load: true
          tags: cmms-opc-service:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy scan on OPC Service
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cmms-opc-service:test
          format: 'sarif'
          output: 'trivy-opc-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-opc-results.sarif'
          category: 'docker-opc-service'

      - name: Run Trivy scan (table output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cmms-opc-service:test
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'

  dockerfile-lint:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Lint Backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: warning

      - name: Lint Frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: warning

      - name: Lint OPC Service Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: opc-service/Dockerfile
          failure-threshold: warning

  docker-compose-check:
    name: Validate Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate docker-compose.yml
        run: |
          docker-compose config --quiet || {
            echo "❌ docker-compose.yml validation failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          echo "✅ docker-compose.yml is valid" >> $GITHUB_STEP_SUMMARY

      - name: Check for security best practices
        run: |
          echo "## 🔒 Docker Compose Security Check" >> $GITHUB_STEP_SUMMARY

          # Check for exposed ports
          if grep -q "ports:" docker-compose.yml; then
            echo "⚠️ Warning: Services expose ports" >> $GITHUB_STEP_SUMMARY
            grep -A 2 "ports:" docker-compose.yml >> $GITHUB_STEP_SUMMARY || true
          fi

          # Check for privileged mode
          if grep -q "privileged: true" docker-compose.yml; then
            echo "❌ Error: Privileged mode detected" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ No privileged containers" >> $GITHUB_STEP_SUMMARY
          fi

  docker-summary:
    name: Docker Security Summary
    runs-on: ubuntu-latest
    needs: [scan-backend, scan-frontend, scan-opc-service, dockerfile-lint, docker-compose-check]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## 🐳 Docker Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Image | ${{ needs.scan-backend.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Image | ${{ needs.scan-frontend.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| OPC Service Image | ${{ needs.scan-opc-service.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dockerfile Lint | ${{ needs.dockerfile-lint.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Compose | ${{ needs.docker-compose-check.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
