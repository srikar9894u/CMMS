name: Playwright Tests

on:
  push:
    branches: [ main, master, develop, claude/* ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start Docker services
        run: |
          docker-compose up -d
          echo "Waiting for services to be ready..."
          sleep 15
          docker-compose ps

      - name: Wait for backend to be healthy
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:3000/api/assets 2>/dev/null; do sleep 2; done'
          echo "Backend is ready"

      - name: Wait for frontend to be healthy
        run: |
          timeout 60 bash -c 'until curl -f http://localhost 2>/dev/null; do sleep 2; done'
          echo "Frontend is ready"

      - name: Run Playwright tests
        run: npm test
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: test-reports/
          retention-days: 30

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots
          path: test-reports/artifacts/
          retention-days: 7

      - name: Comment PR with test results
        uses: daun/playwright-report-comment@v3
        if: always() && github.event_name == 'pull_request'
        with:
          report-path: test-reports/html

      - name: Stop Docker services
        if: always()
        run: docker-compose down -v

  test-summary:
    name: Test Summary
    needs: test
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: test-reports/

      - name: Display test summary
        run: |
          if [ -f test-reports/results.json ]; then
            echo "## 📊 Test Results Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Parse JSON results (simple version)
            TOTAL=$(jq '.suites | map(.specs | length) | add' test-reports/results.json 2>/dev/null || echo "120")
            PASSED=$(jq '[.suites[].specs[].tests[] | select(.status == "expected")] | length' test-reports/results.json 2>/dev/null || echo "0")
            FAILED=$(jq '[.suites[].specs[].tests[] | select(.status != "expected")] | length' test-reports/results.json 2>/dev/null || echo "0")

            echo "- ✅ **Passed**: $PASSED" >> $GITHUB_STEP_SUMMARY
            echo "- ❌ **Failed**: $FAILED" >> $GITHUB_STEP_SUMMARY
            echo "- 📋 **Total**: $TOTAL" >> $GITHUB_STEP_SUMMARY

            PASS_RATE=$((PASSED * 100 / TOTAL))
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Pass Rate**: ${PASS_RATE}%" >> $GITHUB_STEP_SUMMARY

            if [ $PASS_RATE -ge 95 ]; then
              echo "🎉 **Status**: EXCELLENT" >> $GITHUB_STEP_SUMMARY
            elif [ $PASS_RATE -ge 90 ]; then
              echo "✅ **Status**: GOOD" >> $GITHUB_STEP_SUMMARY
            elif [ $PASS_RATE -ge 80 ]; then
              echo "⚠️ **Status**: NEEDS ATTENTION" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ **Status**: CRITICAL" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ Test results not found" >> $GITHUB_STEP_SUMMARY
          fi
