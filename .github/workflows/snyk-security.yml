name: Snyk Security Scan

on:
  push:
    branches: [ main, master, develop, claude/* ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Run every Thursday at 11:00 AM UTC
    - cron: '0 11 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  snyk-backend:
    name: Snyk - Backend (Node.js)
    runs-on: ubuntu-latest
    # Note: This workflow requires SNYK_TOKEN secret to be configured
    # Add your Snyk token at: Settings > Secrets and variables > Actions

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk-backend.sarif
          command: test
          json: true

      - name: Upload Snyk results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-backend.sarif
          category: snyk-backend

  snyk-frontend:
    name: Snyk - Frontend (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk-frontend.sarif
          command: test
          json: true

      - name: Upload Snyk results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-frontend.sarif
          category: snyk-frontend

  snyk-python:
    name: Snyk - OPC Service (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./opc-service
        run: pip install -r requirements.txt

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/python-3.10@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk-python.sarif
          command: test

      - name: Upload Snyk results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-python.sarif
          category: snyk-python

  snyk-docker:
    name: Snyk - Docker Images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [backend, frontend, opc-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: cmms-${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Snyk to check Docker image
        uses: snyk/actions/docker@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: cmms-${{ matrix.service }}:test
          args: --severity-threshold=high --sarif-file-output=snyk-docker-${{ matrix.service }}.sarif

      - name: Upload Snyk results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-docker-${{ matrix.service }}.sarif
          category: snyk-docker-${{ matrix.service }}

  snyk-summary:
    name: Snyk Summary
    runs-on: ubuntu-latest
    needs: [snyk-backend, snyk-frontend, snyk-python, snyk-docker]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## 🔒 Snyk Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | ${{ needs.snyk-backend.result == 'success' && '✅ Passed' || needs.snyk-backend.result == 'skipped' && '⏭️ Skipped (Configure SNYK_TOKEN)' || '⚠️ Issues Found' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.snyk-frontend.result == 'success' && '✅ Passed' || needs.snyk-frontend.result == 'skipped' && '⏭️ Skipped (Configure SNYK_TOKEN)' || '⚠️ Issues Found' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python | ${{ needs.snyk-python.result == 'success' && '✅ Passed' || needs.snyk-python.result == 'skipped' && '⏭️ Skipped (Configure SNYK_TOKEN)' || '⚠️ Issues Found' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker | ${{ needs.snyk-docker.result == 'success' && '✅ Passed' || needs.snyk-docker.result == 'skipped' && '⏭️ Skipped (Configure SNYK_TOKEN)' || '⚠️ Issues Found' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ To enable Snyk scanning, add SNYK_TOKEN secret to repository settings." >> $GITHUB_STEP_SUMMARY
